name: 江中大青年学分监控

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行监控
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          STATE_FILE: seen.json
          WINDOW_HOURS: '72'
        run: python monitor.py

      - name: 保存去重状态
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          git add seen.json
          git diff --quiet --cached || git commit -m "update seen.json"
          git push
